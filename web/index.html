    <title>Carnet</title>
    <!-- Premier rendu, avant même le CSS de l'appli : le fond du thème existe dès la première image (pas de flash blanc en
         sombre), et l'amorce reprend l'écran de lancement. React la remplace dès qu'il démarre. -->
    <style>
      @font-face { font-family: "Literata"; src: url("/polices/literata-opsz.woff2") format("woff2"); font-weight: 200 900; font-display: swap; }
      html { background: #fbfbfa; }
      body { margin: 0; background: #fbfbfa; }
      .amorce { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding-bottom: 8vh; color: #1c2129; font: 600 22px/1 "Literata", ui-serif, Georgia, serif; }
      .amorce__sceau { width: 78px; height: 78px; border-radius: 20px; background: #2d4f86; display: grid; place-items: center; }
      @media (prefers-color-scheme: dark) { html, body { background: #12161c; } .amorce { color: #e5e8ec; } }
    </style>
  </head>
  <body>
    <div id="racine">
      <div class="amorce" role="status" aria-label="Chargement de Carnet">
        <div class="amorce__sceau" aria-hidden="true">

        </div>
        Carnet
      </div>
    </div>
